# Default GROW hyperparameters (matching the paper).
model_id: stabilityai/stable-diffusion-2-1-base
device: cuda
dtype: float32
seed: 42

image_size: 512
num_inference_steps: 50
cfg_scale: 7.5

secret_key: watermark
message: OKOK

# alpha
watermark_strength: 0.5
# eta
guidance_scale: 200.0
# r_start
watermark_start_ratio: 0.5

dct_min: 0.2
dct_max: 0.5
channels: [0, 1, 2, 3]
center_ratio: 1.0

output_dir: outputs/default
